    // =========================================================================
    // SECTION 10: RLE Compression
    // =========================================================================
    function RleSection({ onSolve }) {
      const [inputStr, setInputStr] = useState("AAAAAABBBCCCCCDD");

      const compressed = useMemo(() => {
        if (!inputStr) return "";
        let res = "";
        let count = 1;
        for (let i = 0; i < inputStr.length; i++) {
          if (inputStr[i] === inputStr[i + 1]) {
            count++;
          } else {
            res += inputStr[i] + count;
            count = 1;
          }
        }
        return res;
      }, [inputStr]);

      const ratio = inputStr.length > 0 ? ((compressed.length / inputStr.length) * 100).toFixed(1) : 0;

      // Quiz
      const [quizQ, setQuizQ] = useState({ str: "WWWWWWBBWWWW", ans: "W6B2W4", len: 6 });
      const [userAns, setUserAns] = useState("");
      const [quizResult, setQuizResult] = useState(null);

      const generateQuiz = () => {
        const tests = [
          { s: "AAAAAABBBCC", a: "A6B3C2", l: 6 },
          { s: "WWWWWWBBWWWW", a: "W6B2W4", l: 6 },
          { s: "XXXXYYYYZZZZ", a: "X4Y4Z4", l: 6 },
          { s: "MMMMMMMMDDDD", a: "M8D4", l: 4 }
        ];
        const t = tests[Math.floor(Math.random() * tests.length)];
        setQuizQ({ str: t.s, ans: t.a, len: t.l });
        setUserAns("");
        setQuizResult(null);
      };

      const checkQuiz = (e) => {
        e.preventDefault();
        if (parseInt(userAns) === quizQ.len || userAns.toUpperCase().trim() === quizQ.ans) {
          playSound('success');
          setQuizResult({ ok: true, msg: `Правильно! Сжатая строка: ${quizQ.ans} (длина: ${quizQ.len} байт). +10 баллов!` });
          onSolve(9);
        } else {
          playSound('error');
          setQuizResult({ ok: false, msg: `Неверно. Правильная сжатая строка: ${quizQ.ans} (длина ${quizQ.len} символов).` });
        }
      };

      return (
        <div className="space-y-6">
          {/* Rules Banner */}
          <div className="glass-panel p-5 rounded-2xl border-l-4 border-yellow-500">
            <h3 className="text-lg font-bold text-white mb-2 flex items-center gap-2">
              <span className="p-1.5 bg-yellow-500/20 rounded-lg text-yellow-400">📦</span>
              Правило RLE (Run-Length Encoding)
            </h3>
            <p className="text-sm text-slate-300 mb-2">
              Серии одинаковых подряд идущих символов заменяются на пару: <strong>Символ + Число повторений</strong>.
            </p>
            <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700/60 font-mono text-xs text-yellow-300">
              Пример: AAAAAABBBCC (11 символов) → A6B3C2 (6 символов: A, 6, B, 3, C, 2). Каждый символ весит ровно 1 байт.
            </div>
          </div>

          {/* Interactive RLE Encoder */}
          <div className="glass-panel p-6 rounded-2xl">
            <h4 className="font-bold text-white text-base mb-2">Интерактивный RLE-кодировщик строк</h4>
            <div className="mb-4">
              <label className="text-xs text-slate-400 block mb-1">Исходная строка для сжатия:</label>
              <input
                type="text"
                value={inputStr}
                onChange={(e) => setInputStr(e.target.value.toUpperCase())}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 font-mono text-white text-sm uppercase"
              />
            </div>

            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono space-y-3">
              <div className="flex justify-between items-center text-sm border-b border-slate-800/80 pb-2">
                <span className="text-slate-400">Сжатый результат:</span>
                <span className="text-emerald-400 font-bold text-base">{compressed}</span>
              </div>
              <div className="grid grid-cols-3 gap-2 text-center text-xs">
                <div>
                  <span className="text-slate-500 block">До сжатия</span>
                  <strong className="text-white text-sm">{inputStr.length} байт</strong>
                </div>
                <div>
                  <span className="text-slate-500 block">После сжатия</span>
                  <strong className="text-yellow-400 text-sm">{compressed.length} байт</strong>
                </div>
                <div>
                  <span className="text-slate-500 block">Сжатие</span>
                  <strong className="text-cyan-400 text-sm">{ratio}%</strong>
                </div>
              </div>
            </div>
          </div>

          {/* Practice Quiz */}
          <div className="glass-panel p-6 rounded-2xl border border-yellow-500/30">
            <div className="flex justify-between items-center mb-4">
              <div>
                <h4 className="font-bold text-white text-base flex items-center gap-2">
                  <span className="text-yellow-400">🎯</span> Тренажёр: Длина сжатой строки
                </h4>
                <p className="text-xs text-slate-400">Сколько байт займет строка после сжатия?</p>
              </div>
              <button
                onClick={generateQuiz}
                className="text-xs text-yellow-400 hover:text-yellow-300 underline font-medium"
              >
                Другая строка ⟳
              </button>
            </div>

            <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-800 mb-4">
              <p className="text-sm text-slate-200">
                К строке <strong className="text-yellow-300 font-mono text-base">{quizQ.str}</strong> применили алгоритм RLE.
                Какова длина получившейся сжатой строки в символах (байтах)?
              </p>
            </div>

            <form onSubmit={checkQuiz} className="flex flex-wrap items-center gap-3">
              <input
                type="number"
                placeholder="Длина (байт)..."
                value={userAns}
                onChange={(e) => setUserAns(e.target.value)}
                className="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white font-mono text-sm focus:border-yellow-500 focus:outline-none w-48"
              />
              <button
                type="submit"
                className="px-5 py-2.5 bg-yellow-600 hover:bg-yellow-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-yellow-600/30"
              >
                Проверить ответ
              </button>
            </form>

            {quizResult && (
              <div className={`mt-4 p-3.5 rounded-xl border text-sm font-medium ${quizResult.ok ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-300' : 'bg-rose-950/60 border-rose-500/40 text-rose-300'}`}>
                {quizResult.msg}
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // SECTION 11: 100-Point Blitz Exam (Final Olympiad Simulator)
    // =========================================================================
    function BlitzExamSection({ onExamCompleted }) {
      const EXAM_QUESTIONS = [
        {
          id: 1,
          topic: "Алгоритм шагов (3x+1)",
          q: "Число x = 27. Чему равно число после ровно 6 шагов алгоритма Коллатца?",
          ans: "107",
          hint: "27 -> 82 -> 41 -> 124 -> 62 -> 31 -> 107 (6 шагов)"
        },
        {
          id: 2,
          topic: "Системы счисления",
          q: "Переведите шестнадцатеричное число 4D2₁₆ в десятичную систему счисления:",
          ans: "1234",
          hint: "4×256 + 13×16 + 2×1 = 1024 + 208 + 2 = 1234"
        },
        {
          id: 3,
          topic: "Объем графики",
          q: "Изображение 1024×512 пикселей имеет палитру из 256 цветов (8 бит = 1 байт). Найдите объем файла в Кбайтах:",
          ans: "512",
          hint: "(1024 × 512 × 1 байт) / 1024 = 512 КБайт"
        },
        {
          id: 4,
          topic: "Сети и кабели",
          q: "В полносвязной сети каждый компьютер соединен со всеми остальными. Сколько кабелей нужно для 14 компьютеров?",
          ans: "91",
          hint: "(14 × 13) / 2 = 91 кабель"
        },
        {
          id: 5,
          topic: "Алгебра логики",
          q: "Чему равно значение логического выражения (1 AND 0) OR (NOT 0 AND 1)? Введите 0 или 1:",
          ans: "1",
          hint: "(0) OR (1 AND 1) = 0 OR 1 = 1"
        },
        {
          id: 6,
          topic: "Бинарный поиск",
          q: "Какое максимальное число шагов бинарного поиска нужно для нахождения элемента в массиве из 1024 чисел?",
          ans: "10",
          hint: "2¹⁰ = 1024, поэтому ровно 10 шагов"
        },
        {
          id: 7,
          topic: "Пузырьковая сортировка",
          q: "Сколько обменов совершит сортировка пузырьком для массива [8, 3, 6, 2]?",
          ans: "5",
          hint: "Инверсии: (8,3), (8,6), (8,2), (3,2), (6,2) = 5 обменов"
        },
        {
          id: 8,
          topic: "Рекурсия",
          q: "Дано: F(1)=1, F(n) = n + F(n-1). Найдите значение F(6):",
          ans: "21",
          hint: "1 + 2 + 3 + 4 + 5 + 6 = 21"
        },
        {
          id: 9,
          topic: "Комбинаторика паролей",
          q: "Пароль длины 4 составляется из алфавита в 10 цифр. Сколько всего комбинаций паролей существует?",
          ans: "10000",
          hint: "10⁴ = 10 000 вариантов"
        },
        {
          id: 10,
          topic: "RLE-сжатие",
          q: "Строку AAAAAABBBCC сжали алгоритмом RLE (A6B3C2). Сколько символов (байт) содержит сжатая строка?",
          ans: "6",
          hint: "'A','6','B','3','C','2' = ровно 6 символов"
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);
      const [timeLeft, setTimeLeft] = useState(900); // 15 min timer
      const [isTimerActive, setIsTimerActive] = useState(true);

      useEffect(() => {
        let t;
        if (isTimerActive && timeLeft > 0 && !submitted) {
          t = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        }
        return () => clearInterval(t);
      }, [isTimerActive, timeLeft, submitted]);

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleInput = (qid, val) => {
        setAnswers(prev => ({ ...prev, [qid]: val.trim() }));
      };

      const handleSubmit = () => {
        playSound('click');
        let total = 0;
        EXAM_QUESTIONS.forEach(q => {
          if ((answers[q.id] || "").toLowerCase() === q.ans.toLowerCase()) {
            total += 10;
          }
        });
        setScore(total);
        setSubmitted(true);
        setIsTimerActive(false);

        if (total >= 80) {
          playSound('success');
          try {
            confetti({
              particleCount: 120,
              spread: 70,
              origin: { y: 0.6 }
            });
          } catch(e) {}
        } else {
          playSound('error');
        }

        onExamCompleted(total);
      };

      const resetExam = () => {
        playSound('click');
        setAnswers({});
        setSubmitted(false);
        setScore(0);
        setTimeLeft(900);
        setIsTimerActive(true);
      };

      return (
        <div className="space-y-6">
          {/* Header Bar */}
          <div className="glass-panel p-6 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border border-indigo-500/40">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                  Олимпиада 2026
                </span>
                <h3 className="text-xl font-extrabold text-white">Республиканский Блиц-Экзамен</h3>
              </div>
              <p className="text-xs text-slate-400">10 задач по 10 баллов каждая. Максимальный результат: 100 баллов!</p>
            </div>

            <div className="flex items-center gap-4">
              <div className="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-center font-mono">
                <span className="text-[10px] text-slate-400 block uppercase">Время</span>
                <span className={`text-lg font-bold ${timeLeft < 180 ? 'text-rose-400 animate-pulse' : 'text-indigo-400'}`}>
                  {formatTime(timeLeft)}
                </span>
              </div>
              {submitted && (
                <button
                  onClick={resetExam}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-xl transition"
                >
                  Сдать заново ⟳
                </button>
              )}
            </div>
          </div>

          {/* Results Card if Submitted */}
          {submitted && (
            <div className="glass-panel p-6 rounded-2xl text-center border-2 border-indigo-500 glow-indigo">
              <span className="text-5xl block mb-2">{score >= 80 ? '🥇' : score >= 50 ? '🥈' : '🥉'}</span>
              <h4 className="text-2xl font-black text-white mb-1">Твой результат: {score} из 100 баллов!</h4>
              <p className="text-sm text-slate-300 max-w-md mx-auto">
                {score === 100
                  ? 'Невероятно! Абсолютный победитель! Ты готов занять первое место на олимпиаде!'
                  : score >= 80
                  ? 'Отличный результат! У тебя прекрасные шансы на диплом победителя!'
                  : 'Хорошая попытка! Повтори разделы, где возникли ошибки, и попробуй снова!'}
              </p>
            </div>
          )}

          {/* Questions List */}
          <div className="space-y-4">
            {EXAM_QUESTIONS.map((q, idx) => {
              const isCorrect = submitted && (answers[q.id] || "").toLowerCase() === q.ans.toLowerCase();
              return (
                <div
                  key={q.id}
                  className={`glass-panel p-5 rounded-2xl border transition ${
                    submitted
                      ? isCorrect
                        ? 'border-emerald-500/50 bg-emerald-950/20'
                        : 'border-rose-500/50 bg-rose-950/20'
                      : 'border-slate-800'
                  }`}
                >
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-bold text-indigo-400 font-mono">
                      Задание #{idx + 1} • {q.topic} (10 баллов)
                    </span>
                    {submitted && (
                      <span className={`text-xs font-bold font-mono px-2 py-0.5 rounded ${isCorrect ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                        {isCorrect ? '+10 баллов' : '0 баллов'}
                      </span>
                    )}
                  </div>
                  <p className="text-sm text-slate-200 mb-3">{q.q}</p>

                  <div className="flex flex-wrap items-center gap-3">
                    <input
                      type="text"
                      disabled={submitted}
                      placeholder="Ответ..."
                      value={answers[q.id] || ""}
                      onChange={(e) => handleInput(q.id, e.target.value)}
                      className={`bg-slate-900 border rounded-xl px-4 py-2 font-mono text-sm focus:outline-none w-48 ${
                        submitted
                          ? isCorrect
                            ? 'border-emerald-500 text-emerald-300 font-bold'
                            : 'border-rose-500 text-rose-300 font-bold'
                          : 'border-slate-700 text-white focus:border-indigo-500'
                      }`}
                    />
                    {submitted && !isCorrect && (
                      <div className="text-xs text-rose-400">
                        Правильный ответ: <strong className="font-mono text-white">{q.ans}</strong>
                      </div>
                    )}
                  </div>

                  {submitted && (
                    <div className="mt-3 pt-2.5 border-t border-slate-800/80 text-xs text-slate-400">
                      💡 <strong>Разбор:</strong> {q.hint}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Submit Button */}
          {!submitted && (
            <div className="text-center pt-2">
              <button
                onClick={handleSubmit}
                className="px-8 py-3.5 bg-gradient-to-r from-indigo-600 via-indigo-500 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-extrabold rounded-2xl text-base transition shadow-xl shadow-indigo-600/30 transform hover:-translate-y-0.5"
              >
                Завершить экзамен и проверить результат 🚀
              </button>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function App() {
      const [tab, setTab] = useState(0);
      const [lang, setLang] = useState('ru'); // 'ru' or 'tj'
      const [solvedTopics, setSolvedTopics] = useState({});
      const [examBestScore, setExamBestScore] = useState(0);
      const [showCheatModal, setShowCheatModal] = useState(false);

      // Load saved progress from localStorage
      useEffect(() => {
        try {
          const savedSolved = localStorage.getItem('olimp_solved');
          if (savedSolved) setSolvedTopics(JSON.parse(savedSolved));
          const savedScore = localStorage.getItem('olimp_exam_score');
          if (savedScore) setExamBestScore(parseInt(savedScore) || 0);
        } catch(e) {}
      }, []);

      const markSolved = (topicId) => {
        setSolvedTopics(prev => {
          const next = { ...prev, [topicId]: true };
          try { localStorage.setItem('olimp_solved', JSON.stringify(next)); } catch(e) {}
          return next;
        });
      };

      const handleExamDone = (score) => {
        if (score > examBestScore) {
          setExamBestScore(score);
          try { localStorage.setItem('olimp_exam_score', score.toString()); } catch(e) {}
        }
      };

      const solvedCount = Object.keys(solvedTopics).length;

      return (
        <div className="min-h-screen pb-16">
          {/* Top Navbar */}
          <header className="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-500/25">
                  ⚡
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-black tracking-tight text-white flex items-center gap-2">
                    Олимпиада Информатика <span className="text-xs font-normal text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded-full border border-indigo-500/20">Таджикистан</span>
                  </h1>
                  <p className="text-[11px] text-slate-400 hidden sm:block">Интерактивный тренажёр и база знаний ко всем 10 разделам</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {/* Stats Chips */}
                <div className="hidden md:flex items-center gap-2 text-xs font-mono">
                  <div className="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-emerald-400">
                    🏆 Решено: <strong>{solvedCount}/10</strong>
                  </div>
                  {examBestScore > 0 && (
                    <div className="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-amber-400">
                      ⭐ Рекорд: <strong>{examBestScore}/100</strong>
                    </div>
                  )}
                </div>

                {/* Quick Cheat Sheet Button */}
                <button
                  onClick={() => { playSound('click'); setShowCheatModal(true); }}
                  className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold rounded-lg transition flex items-center gap-1.5"
                >
                  <span>📋</span>
                  <span className="hidden sm:inline">Шпаргалка</span>
                </button>

                {/* Language Toggle */}
                <button
                  onClick={() => { playSound('click'); setLang(lang === 'ru' ? 'tj' : 'ru'); }}
                  className="px-2.5 py-1.5 bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 text-xs font-bold rounded-lg transition"
                >
                  {lang === 'ru' ? '🇹🇯 TJ' : '🇷🇺 RU'}
                </button>
              </div>
            </div>
          </header>

          {/* Main Hero & Topic Tabs */}
          <main className="max-w-6xl mx-auto px-4 sm:px-6 pt-6">
            {/* Quick Hero Banner */}
            <div className="mb-6 p-6 rounded-3xl bg-gradient-to-r from-indigo-950/60 via-slate-900/60 to-slate-950/80 border border-indigo-500/20 relative overflow-hidden">
              <div className="absolute -right-12 -top-12 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none" />
              <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-indigo-400 block mb-1">
                    {lang === 'ru' ? '🚀 Полная подготовка к республиканской олимпиаде' : '🚀 Омодагии пурра ба олимпиадаи ҷумҳуриявӣ'}
                  </span>
                  <h2 className="text-xl sm:text-2xl font-black text-white">
                    {lang === 'ru' ? 'Тренажёр и калькулятор по всем 10 темам' : 'Тренажёр ва ҳисобкунак барои ҳамаи 10 мавзӯъ'}
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-400 mt-1 max-w-xl">
                    Выбирай нужную тему ниже: читай шпаргалку с формулами, экспериментируй в интерактивном симуляторе и решай практические задачи.
                  </p>
                </div>
                <button
                  onClick={() => { playSound('click'); setTab(10); }}
                  className="self-start md:self-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-bold rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center gap-2"
                >
                  <span>🔥 Сдать Блиц-Экзамен (100 б.)</span>
                </button>
              </div>
            </div>

            {/* Topic Navigation Tabs */}
            <div className="flex gap-2 overflow-x-auto pb-3 custom-scroll mb-6">
              {SECTIONS.map((s, idx) => {
                const isActive = tab === idx;
                const isSolved = solvedTopics[s.id];
                return (
                  <button
                    key={s.id}
                    onClick={() => { playSound('click'); setTab(idx); }}
                    className={`flex-shrink-0 px-4 py-2.5 rounded-xl border text-xs font-semibold transition flex items-center gap-2 ${
                      isActive
                        ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg shadow-indigo-600/25'
                        : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                    }`}
                  >
                    <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-mono font-bold ${isActive ? 'bg-white text-indigo-900' : 'bg-slate-800 text-slate-300'}`}>
                      {s.num}
                    </span>
                    <span>{lang === 'ru' ? s.title : s.titleTj}</span>
                    {isSolved && <span className="text-emerald-400 text-xs">✓</span>}
                  </button>
                );
              })}
            </div>

            {/* Section Header */}
            <div className="mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <span className="text-xs font-mono font-semibold text-indigo-400 uppercase tracking-wider">
                  Раздел {SECTIONS[tab].num} из 11 • {SECTIONS[tab].badge}
                </span>
                <h2 className="text-2xl font-black text-white">
                  {lang === 'ru' ? SECTIONS[tab].title : SECTIONS[tab].titleTj}
                </h2>
                <p className="text-xs sm:text-sm text-slate-400">{SECTIONS[tab].desc}</p>
              </div>
            </div>

            {/* Dynamic Active Tab Content */}
            <div className="transition-all duration-200">
              {tab === 0 && <CollatzSection onSolve={markSolved} />}
              {tab === 1 && <NumberSystemsSection onSolve={markSolved} />}
              {tab === 2 && <VolumeSection onSolve={markSolved} />}
              {tab === 3 && <NetworkSection onSolve={markSolved} />}
              {tab === 4 && <LogicSection onSolve={markSolved} />}
              {tab === 5 && <BinarySearchSection onSolve={markSolved} />}
              {tab === 6 && <BubbleSortSection onSolve={markSolved} />}
              {tab === 7 && <RecursionSection onSolve={markSolved} />}
              {tab === 8 && <CombinatoricsSection onSolve={markSolved} />}
              {tab === 9 && <RleSection onSolve={markSolved} />}
              {tab === 10 && <BlitzExamSection onExamCompleted={handleExamDone} />}
            </div>
          </main>

          {/* Quick Cheat Sheet Modal */}
          {showCheatModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto custom-scroll p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    📋 Главная шпаргалка формул к олимпиаде
                  </h3>
                  <button
                    onClick={() => setShowCheatModal(false)}
                    className="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>
                <div className="space-y-3 text-xs font-mono">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-indigo-400 block mb-1">1. Шаги Коллатца:</strong>
                    Четное: x / 2. Нечетное: 3x + 1.
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-cyan-400 block mb-1">2. Системы счисления:</strong>
                    2-ичная: 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024.<br/>
                    16-ричная: 1, 16, 256. A=10, B=11, C=12, D=13, E=14, F=15.
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-amber-400 block mb-1">3. Объем текста и графики:</strong>
                    Текст: I = K × i (1 байт = 8 бит). Картинка: V = W × H × i бит. 1 КБ = 1024 Б.
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-violet-400 block mb-1">4. Кабели в сети:</strong>
                    C = N × (N - 1) / 2. Для 14 компов: (14×13)/2 = 91 кабель.
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-emerald-400 block mb-1">5. Логика:</strong>
                    AND — умножение. OR — сложение. NOT — инверсия.
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-sky-400 block mb-1">6. Бинарный поиск:</strong>
                    Число сравнений K = ⌈log₂ N⌉ (наименьшее 2ᴷ ≥ N).
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-rose-400 block mb-1">7. Пузырьковая сортировка:</strong>
                    Число обменов = количество инверсий (пар A[i] &gt; A[j] при i &lt; j).
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-teal-400 block mb-1">8. Рекурсия:</strong>
                    Считайте снизу вверх: F(1), затем F(2), F(3)...
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-fuchsia-400 block mb-1">9. Пароли:</strong>
                    Варианты = Kᴸ (мощность алфавита в степени длины).
                  </div>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800">
                    <strong className="text-yellow-400 block mb-1">10. RLE-сжатие:</strong>
                    AAAAAABBBCC → A6B3C2 (каждый символ и цифра = 1 байт).
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
